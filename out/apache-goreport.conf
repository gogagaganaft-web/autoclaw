# GOREPORT: проксирование API через Apache 2.4 (XAMPP, порт 90).
# Вставить в C:\xampp\apache\conf\extra\httpd-vhosts.conf внутрь <VirtualHost *:90>
# либо в конец httpd.conf, если виртхоста нет.

# --- 1. Модули (один раз, в C:\xampp\apache\conf\httpd.conf, раскомментировать):
# LoadModule proxy_module modules/mod_proxy.so
# LoadModule proxy_http_module modules/mod_proxy_http.so

ProxyPreserveHost On
ProxyRequests Off

# --- 2. Метаданные, панель фильтров, состояния видов, пользователь: служба 7505
ProxyPass        "/api/reports"    "http://127.0.0.1:7505/api/reports"
ProxyPassReverse "/api/reports"    "http://127.0.0.1:7505/api/reports"

ProxyPass        "/api/toolbar"    "http://127.0.0.1:7505/api/toolbar"
ProxyPassReverse "/api/toolbar"    "http://127.0.0.1:7505/api/toolbar"

ProxyPass        "/api/user-state" "http://127.0.0.1:7505/api/user-state"
ProxyPassReverse "/api/user-state" "http://127.0.0.1:7505/api/user-state"

ProxyPass        "/api/me"         "http://127.0.0.1:7505/api/me"
ProxyPassReverse "/api/me"         "http://127.0.0.1:7505/api/me"

ProxyPass        "/api/meta"       "http://127.0.0.1:7505/api/meta"
ProxyPassReverse "/api/meta"       "http://127.0.0.1:7505/api/meta"

# --- 3. Боевые службы: выполнение SQL, дерево, отчёты, сводные
ProxyPass        "/api/execute"       "http://127.0.0.1:7501/api/execute"
ProxyPassReverse "/api/execute"       "http://127.0.0.1:7501/api/execute"

ProxyPass        "/api/exec-select"   "http://127.0.0.1:7501/api/exec-select"
ProxyPassReverse "/api/exec-select"   "http://127.0.0.1:7501/api/exec-select"

ProxyPass        "/api/tree-find-all" "http://127.0.0.1:7503/api/tree-find-all"
ProxyPassReverse "/api/tree-find-all" "http://127.0.0.1:7503/api/tree-find-all"

ProxyPass        "/api/export-excel"  "http://127.0.0.1:7501/api/export-excel"
ProxyPassReverse "/api/export-excel"  "http://127.0.0.1:7501/api/export-excel"

ProxyPass        "/api/report/"       "http://127.0.0.1:7502/api/report/"
ProxyPassReverse "/api/report/"       "http://127.0.0.1:7502/api/report/"

ProxyPass        "/api/multi/"        "http://127.0.0.1:7504/api/multi/"
ProxyPassReverse "/api/multi/"        "http://127.0.0.1:7504/api/multi/"

# --- 4. Если фронт использует history-роутинг (URL без #), добавить:
# FallbackResource /index.html

# Таймауты для тяжёлых отчётов:
ProxyTimeout 600