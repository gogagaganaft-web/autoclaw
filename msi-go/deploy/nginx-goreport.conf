# GOREPORT: статика + маршрутизация API по службам.
# Положить в /etc/nginx/sites-available/goreport и симлинкнуть в sites-enabled.

server {
    listen 80;
    server_name _;

    root /var/www/goreport;     # сюда распакован dist (index.html рядом)
    index index.html;
    client_max_body_size 64m;

    # SPA: любой путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- метаданные, панель фильтров, состояния видов, пользователь: служба 7505
    location ~ ^/api/(reports|toolbar|user-state|me|meta)(/|$) {
        proxy_pass http://127.0.0.1:7505;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- выполнение SQL, дерево, справочники: боевые службы
    location = /api/execute        { proxy_pass http://127.0.0.1:7501; proxy_read_timeout 600s; }
    location = /api/execute-multi  { proxy_pass http://127.0.0.1:7501; proxy_read_timeout 600s; }
    location = /api/exec-select    { proxy_pass http://127.0.0.1:7501; }
    location = /api/tree-find-all  { proxy_pass http://127.0.0.1:7503; }
    location = /api/export-excel   { proxy_pass http://127.0.0.1:7501; proxy_read_timeout 600s; }
    location /api/report/          { proxy_pass http://127.0.0.1:7502; proxy_read_timeout 600s; }
    location /api/multi/           { proxy_pass http://127.0.0.1:7504; proxy_read_timeout 600s; }
}