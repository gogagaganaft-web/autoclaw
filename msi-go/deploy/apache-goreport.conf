# ============================================================================
#  GOREPORT: проксирование API через Apache 2.4 (XAMPP, порт 90)
#
#  Куда вставлять: C:\xampp\apache\conf\extra\httpd-vhosts.conf внутрь
#  <VirtualHost *:90> либо в конец httpd.conf, если виртхоста нет.
#
#  ВАЖНО: правила идут от частных к общим. Если ниже в конфиге есть общее
#  правило вида ProxyPass "/api" "...", эти строки должны стоять ВЫШЕ него —
#  Apache берёт первое совпавшее правило.
# ============================================================================

# --- 1. Модули (один раз, в C:\xampp\apache\conf\httpd.conf):
# LoadModule proxy_module      modules/mod_proxy.so
# LoadModule proxy_http_module modules/mod_proxy_http.so
# LoadModule headers_module    modules/mod_headers.so

ProxyPreserveHost On
ProxyRequests Off

# --- 2. Служба store (7505): отчёты и их данные, фильтры, запросы,
#        панель фильтров, состояния видов, справочники, пользователь.

# Фильтры «Контура данных» — без этих двух правил страница /admin/filters
# получает 404.
ProxyPass        "/api/filters"    "http://127.0.0.1:7505/api/filters"
ProxyPassReverse "/api/filters"    "http://127.0.0.1:7505/api/filters"

ProxyPass        "/api/queries"    "http://127.0.0.1:7505/api/queries"
ProxyPassReverse "/api/queries"    "http://127.0.0.1:7505/api/queries"

# Элементы списков (multi-select-list, справочники) — серверный поиск.
ProxyPass        "/api/items"      "http://127.0.0.1:7505/api/items"
ProxyPassReverse "/api/items"      "http://127.0.0.1:7505/api/items"

# Отчёты и данные отчёта: /api/reports, /api/reports/<key>,
# /api/reports/<key>/data — всё обслуживает 7505.
ProxyPass        "/api/reports"    "http://127.0.0.1:7505/api/reports"
ProxyPassReverse "/api/reports"    "http://127.0.0.1:7505/api/reports"

ProxyPass        "/api/toolbar"    "http://127.0.0.1:7505/api/toolbar"
ProxyPassReverse "/api/toolbar"    "http://127.0.0.1:7505/api/toolbar"

ProxyPass        "/api/user-state" "http://127.0.0.1:7505/api/user-state"
ProxyPassReverse "/api/user-state" "http://127.0.0.1:7505/api/user-state"

ProxyPass        "/api/me"         "http://127.0.0.1:7505/api/me"
ProxyPassReverse "/api/me"         "http://127.0.0.1:7505/api/me"

ProxyPass        "/api/meta"       "http://127.0.0.1:7505/api/meta"
ProxyPassReverse "/api/meta"       "http://127.0.0.1:7505/api/meta"

# --- 3. Боевые службы: выполнение SQL, дерево, отчёты, сводные

ProxyPass        "/api/execute"       "http://127.0.0.1:7501/api/execute"
ProxyPassReverse "/api/execute"       "http://127.0.0.1:7501/api/execute"

ProxyPass        "/api/exec-select"   "http://127.0.0.1:7501/api/exec-select"
ProxyPassReverse "/api/exec-select"   "http://127.0.0.1:7501/api/exec-select"

ProxyPass        "/api/export-excel"  "http://127.0.0.1:7501/api/export-excel"
ProxyPassReverse "/api/export-excel"  "http://127.0.0.1:7501/api/export-excel"

ProxyPass        "/api/report/"       "http://127.0.0.1:7502/api/report/"
ProxyPassReverse "/api/report/"       "http://127.0.0.1:7502/api/report/"

ProxyPass        "/api/tree-find-all" "http://127.0.0.1:7503/api/tree-find-all"
ProxyPassReverse "/api/tree-find-all" "http://127.0.0.1:7503/api/tree-find-all"

ProxyPass        "/api/multi/"        "http://127.0.0.1:7504/api/multi/"
ProxyPassReverse "/api/multi/"        "http://127.0.0.1:7504/api/multi/"

# --- 4. Таймауты для тяжёлых отчётов
ProxyTimeout 600

# --- 5. Статика фронта (если ещё не настроена в этом VirtualHost).
#     base в vite.config.js — '/gr/', поэтому каталог должен называться gr.
#
# Alias /gr "C:/xampp/htdocs/gr"
# <Directory "C:/xampp/htdocs/gr">
#     Options -Indexes
#     AllowOverride None
#     Require all granted
#     DirectoryIndex index.html
#     <FilesMatch "index\.html$">
#         Header set Cache-Control "no-cache, must-revalidate"
#     </FilesMatch>
# </Directory>
#
# FallbackResource не нужен: роутинг хешовый (#/report/...).
