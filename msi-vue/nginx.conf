server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Хешированные ассеты сборки можно кешировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA (хеш-роутинг — fallback на index.html на случай прямых ссылок).
    # index.html кешировать нельзя: в нём ссылки на файлы с новыми хешами.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API backend (Go) в той же docker-сети
    location /api/ {
        proxy_pass http://backend:7070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 320s;
        client_max_body_size 20m;
    }
}
