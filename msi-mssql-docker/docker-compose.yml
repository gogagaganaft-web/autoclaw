services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
      - MSSQL_AGENT_ENABLED=true
    shm_size: 2gb
    volumes:
      - mssql_data:/var/opt/mssql
      - ./backup:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -C -Q 'SELECT 1' -b || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: always
    networks:
      - msi_app

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: db_init
    volumes:
      - ./init-db.sql:/init-db.sql
      - ./init-db.sh:/init-db.sh
    command: /bin/bash /init-db.sh
    depends_on:
      mssql:
        condition: service_healthy
    restart: "no"
    networks:
      - msi_app

volumes:
  mssql_data:


networks:
  msi_app:
    name: msi_app
    driver: bridge